<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring AI 调试台</title>
    <link rel="stylesheet" href="/chat.css">
    <script src="/chat.js" defer></script>
</head>
<body>
<main>
    <header><span>SPRING AI</span><h1>模型调试台</h1><p>选择厂商，开始一段对话。密钥由服务端配置。</p></header>
    <form id="chat-form">
        <div class="settings">
            <label>模型厂商<select id="provider" required><option value="">正在加载…</option></select></label>
            <label>模型名称（可选）<input id="model" maxlength="128" placeholder="使用厂商默认模型"></label>
            <label class="toggle"><input id="stream" type="checkbox" checked>流式输出</label>
        </div>
        <div id="messages" aria-label="对话记录"><p class="empty">输入问题后，回答会显示在这里。</p></div>
        <label for="question">你的问题</label>
        <textarea id="question" rows="4" maxlength="16000" required placeholder="例如：结合 Java 解释 Spring AI 的 ChatClient 与 ChatModel"></textarea>
        <div class="actions">
            <button id="send" type="submit" disabled>发送</button>
            <button id="stop" type="button" disabled>停止</button>
            <button id="clear" type="button">清空对话</button>
        </div>
    </form>
    <p id="status" role="status" aria-live="polite">正在读取厂商配置…</p>
    <footer>对话只保存在当前页面内存中，刷新或切换模型后清空；最多携带最近 19 轮历史。</footer>
</main>
</body>
</html>
