<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>拾光 · 成长记录</title>
</head>
<body style="margin:0;padding:0;background-color:#f8f7f2;color:#38423a;font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;-webkit-text-size-adjust:100%;">
  <div style="display:none;font-size:1px;line-height:1px;color:#f8f7f2;max-height:0;max-width:0;opacity:0;overflow:hidden;mso-hide:all;">{{preheader}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f8f7f2" style="width:100%;border-collapse:collapse;">
    <tr><td align="center" style="padding:28px 12px;">
      <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:600px;border-collapse:separate;">
        <tr><td style="padding:0 12px 22px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
            <td width="46" height="46" align="center" bgcolor="#eaf0e4" style="width:46px;height:46px;border-radius:15px;color:#526b50;font-family:'Songti SC',SimSun,serif;font-size:25px;">拾</td>
            <td style="padding-left:12px;"><div style="font-family:'Songti SC',SimSun,serif;font-size:25px;letter-spacing:4px;color:#38423a;line-height:1.4;">拾光</div><div style="font-size:9px;letter-spacing:2px;color:#71866d;line-height:1.8;">LITTLE MOMENTS</div></td>
          </tr></table>
        </td></tr>
        <tr><td bgcolor="#fffefa" style="background-color:#fffefa;border:1px solid #e9e9df;border-radius:20px;overflow:hidden;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;table-layout:fixed;">
            <tr><td height="6" bgcolor="#71866d" style="height:6px;font-size:1px;line-height:6px;border-radius:20px 20px 0 0;">&nbsp;</td></tr>
            <tr><td style="padding:30px 24px 0;">
              <span style="display:inline-block;background-color:#eaf0e4;color:#526b50;border-radius:6px;padding:5px 10px;font-size:12px;line-height:1.5;">{{label}}</span>
              <h1 style="margin:18px 0 10px;font-family:'Songti SC',SimSun,serif;font-size:27px;font-weight:normal;line-height:1.5;color:#38423a;">{{heading}}</h1>
              <p style="margin:0 0 24px;font-size:14px;line-height:1.9;color:#788271;">{{intro}}</p>
            </td></tr>
            <tr><td style="padding:0 24px 26px;overflow-wrap:anywhere;word-wrap:break-word;word-break:break-word;">{{body}}</td></tr>
            <tr><td style="padding:20px 24px;border-top:1px solid #e9e9df;">
              <p style="margin:0;font-size:12px;line-height:1.9;color:#788271;">{{footer}}</p>
            </td></tr>
          </table>
        </td></tr>
        <tr><td align="center" style="padding:24px 12px 8px;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="center"><tr>
            <td width="28" height="4" bgcolor="#cad8bf" style="width:28px;height:4px;font-size:1px;line-height:4px;">&nbsp;</td>
            <td width="8" style="width:8px;font-size:1px;">&nbsp;</td>
            <td width="28" height="4" bgcolor="#f3e6d8" style="width:28px;height:4px;font-size:1px;line-height:4px;">&nbsp;</td>
            <td width="8" style="width:8px;font-size:1px;">&nbsp;</td>
            <td width="28" height="4" bgcolor="#cad8bf" style="width:28px;height:4px;font-size:1px;line-height:4px;">&nbsp;</td>
          </tr></table>
          <p style="margin:16px 0 6px;font-family:'Songti SC',SimSun,serif;font-size:14px;letter-spacing:1px;line-height:1.8;color:#71866d;">把重要的小事，放在心上。</p>
          <p style="margin:0;font-size:11px;line-height:1.8;color:#8d9186;">拾光 · 成长记录 &nbsp; / &nbsp; 这是一封系统通知邮件</p>
        </td></tr>
      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td></tr>
  </table>
</body>
</html>
